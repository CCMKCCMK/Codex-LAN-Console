name: CodexLanConsole

options:
  bundleIdPrefix: local.codex
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES

targets:
  CodexLanConsole:
    type: application
    platform: iOS
    sources:
      - path: CodexLanConsole
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.codex.lanconsole.ios
        PRODUCT_NAME: CodexLanConsole
        PRODUCT_MODULE_NAME: CodexLanConsole
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: CodexLanConsole/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        CURRENT_PROJECT_VERSION: 7
        MARKETING_VERSION: 1.5.0
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    dependencies:
      - sdk: WebKit.framework
      - sdk: Security.framework
      - sdk: UserNotifications.framework
      - sdk: BackgroundTasks.framework

  CodexLanConsoleTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CodexLanConsoleTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.codex.lanconsole.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
    dependencies:
      - target: CodexLanConsole

schemes:
  CodexLanConsole:
    build:
      targets:
        CodexLanConsole: all
        CodexLanConsoleTests:
          - test
    test:
      gatherCoverageData: true
      targets:
        - name: CodexLanConsoleTests
          parallelizable: false
